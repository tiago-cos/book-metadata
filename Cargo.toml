[package]
name = "book-metadata"
version = "0.1.0"
edition = "2024"
authors = ["tiago.costa.sousa@proton.me"]
description = "A unified, extensible interface for fetching book metadata from multiple providers."
repository = "https://github.com/tiago-cos/book-metadata"
license = "MIT"
readme = "README.md"
keywords = ["book", "metadata", "isbn", "hardcover", "library"]
categories = ["api-bindings"]

[features]
default = ["hardcover", "openlibrary", "googlebooks"]
hardcover = ["_provider"]
openlibrary = ["_provider"]
googlebooks = ["_provider"]

_provider = ["dep:reqwest", "dep:serde_json"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[example]]
name = "search"
required-features = ["hardcover", "openlibrary", "googlebooks"]

[package.metadata.docs.rs]
all-features = true
